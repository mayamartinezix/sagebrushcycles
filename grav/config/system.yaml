# Sagebrush variant overrides applied on top of the stock grav-admin
# system.yaml during the Docker build. Default theme -> sagebrush; '/' resolves
# to the 01.home page.
absolute_urls: false

home:
  alias: '/home'

pages:
  theme: sagebrush
  markdown:
    extra: false
  process:
    markdown: true
    twig: false

cache:
  enabled: true
  check:
    method: file
  driver: auto
  prefix: 'g'

twig:
  cache: true
  debug: false
  auto_reload: true
  autoescape: true

assets:
  css_pipeline: false
  css_minify: true
  css_rewrite: true
  js_pipeline: false
  js_module_pipeline: false
  js_minify: true

errors:
  display: false
  log: true

debugger:
  enabled: false

gpm:
  verify_peer: true
