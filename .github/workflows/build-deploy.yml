name: build-deploy

# Build the nginx image, push it to ghcr.io, render the digest-pinned deploy
# manifest bundle and push it as a Flux OCI artifact, then ping rumi's Flux
# Receiver to pull immediately.
#
# rumi side: apps/weeeeeiserbikes/ in the rumi repo holds the OCIRepository
# (tracks `sagebrushcycles-deploy:preview`), the Kustomization, and the
# generic-hmac Receiver fronted by flux-webhook.staging.tripoli.systems.
#
# Required repo secrets:
#   RUMI_FLUX_WEBHOOK_URL    Full receiver URL incl. the /hook/<token> path
#                            (read it from the Receiver status once applied:
#                            kubectl -n flux-system get receiver weeeeeiserbikes
#                              -o jsonpath='{.status.webhookPath}')
#   RUMI_FLUX_WEBHOOK_TOKEN  The HMAC token (same value seeded in Vault
#                            kv/flux-webhook under `token`)
# Both optional — if unset, the job still builds/pushes and rumi picks the
# change up on the OCIRepository's poll interval.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/licenseplated/sagebrushcycles
  DEPLOY_REPO: ghcr.io/licenseplated/sagebrushcycles-deploy
  FLUX_VERSION: "2.8.6"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # provenance:false keeps the pushed tag a single image manifest
          # (no attestation index), so the digest we pin below is the image
          # itself.
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}:preview
            ${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Setup Flux CLI
        run: |
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux
          flux --version

      - name: Render + push deploy manifest artifact
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
          echo "Pinning Deployment image to ${IMAGE}"
          sed -i "s|__IMAGE__|${IMAGE}|g" deploy/deployment.yaml
          grep -q "__IMAGE__" deploy/deployment.yaml && { echo "image placeholder not substituted"; exit 1; } || true

          flux push artifact \
            "oci://${DEPLOY_REPO}:${{ github.sha }}" \
            --path=deploy \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="main@sha1:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          flux tag artifact \
            "oci://${DEPLOY_REPO}:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --tag preview

      - name: Trigger rumi Flux Receiver
        env:
          WEBHOOK_URL: ${{ secrets.RUMI_FLUX_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.RUMI_FLUX_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_TOKEN:-}" ]; then
            echo "RUMI_FLUX_WEBHOOK_URL / _TOKEN not set — rumi will pick this up on the OCIRepository poll interval."
            exit 0
          fi
          payload='{}'
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_TOKEN" | awk '{print $2}')
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=${sig}" \
            -d "$payload"
          echo "Receiver pinged."
