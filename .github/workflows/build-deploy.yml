name: build-deploy

# VARIANT BRANCH: cms/grav — Grav CMS overlay.
#
# Same pipeline as main, parameterized for this variant: build the Grav image
# (php:8.3-apache + Grav + Admin, with the prebuilt static React bundle baked
# into the sagebrush theme), push it to ghcr with variant-prefixed tags, render
# the digest-pinned deploy bundle, push it as a Flux OCI artifact (tag
# `grav-preview`), then ping rumi's Flux Receiver for the -grav subdomain.
#
# rumi side: apps/weeeeeiserbikes-grav/ in the rumi repo holds the
# OCIRepository (tracks `sagebrushcycles-deploy:grav-preview`), Kustomization,
# and generic-hmac Receiver fronted by flux-webhook.staging.tripoli.systems.
#
# Required repo secrets (optional — falls back to the OCIRepository poll):
#   RUMI_FLUX_WEBHOOK_URL_GRAV    Receiver URL incl. the /hook/<token> path.
#   RUMI_FLUX_WEBHOOK_TOKEN_GRAV  HMAC token (same value in Vault kv/flux-webhook-grav).

on:
  push:
    branches: [cms/grav]
    paths:
      - "src/**"
      - "build.mjs"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "grav/**"
      - "deploy/**"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch:

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VARIANT: grav
  IMAGE_REPO: ghcr.io/licenseplated/sagebrushcycles
  DEPLOY_REPO: ghcr.io/licenseplated/sagebrushcycles-deploy
  FLUX_VERSION: "2.8.6"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VARIANT }}-preview
            ${{ env.IMAGE_REPO }}:${{ env.VARIANT }}-${{ github.sha }}

      - name: Setup Flux CLI
        run: |
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin flux
          flux --version

      - name: Render + push deploy manifest artifact
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_REPO}@${IMAGE_DIGEST}"
          echo "Pinning Deployment image to ${IMAGE}"
          sed -i "s|__IMAGE__|${IMAGE}|g" deploy/deployment.yaml
          grep -q "__IMAGE__" deploy/deployment.yaml && { echo "image placeholder not substituted"; exit 1; } || true

          flux push artifact \
            "oci://${DEPLOY_REPO}:${VARIANT}-${{ github.sha }}" \
            --path=deploy \
            --source="${{ github.server_url }}/${{ github.repository }}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          flux tag artifact \
            "oci://${DEPLOY_REPO}:${VARIANT}-${{ github.sha }}" \
            --creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            --tag "${VARIANT}-preview"

      - name: Trigger rumi Flux Receiver
        env:
          WEBHOOK_URL: ${{ secrets.RUMI_FLUX_WEBHOOK_URL_GRAV }}
          WEBHOOK_TOKEN: ${{ secrets.RUMI_FLUX_WEBHOOK_TOKEN_GRAV }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ] || [ -z "${WEBHOOK_TOKEN:-}" ]; then
            echo "RUMI_FLUX_WEBHOOK_URL_GRAV / _TOKEN_GRAV not set — rumi picks this up on the OCIRepository poll interval."
            exit 0
          fi
          payload='{}'
          sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_TOKEN" | awk '{print $2}')
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=${sig}" \
            -d "$payload"
          echo "Receiver pinged."
