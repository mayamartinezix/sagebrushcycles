---
# WordPress (SQLite) — vanilla serving image + custom prep initContainer.
#
# • initContainer `prep` = our custom image (digest-pinned by CI: __IMAGE__ is
#   rewritten to ghcr.io/licenseplated/sagebrushcycles@sha256:<digest>). It
#   copies our theme/bundle/SQLite-plugin/db.php onto the PVC and runs the WP
#   install. Pinning the digest rolls the pod whenever our code changes.
# • container `wordpress` = the UNMODIFIED upstream wordpress image. It serves
#   the prepped volume; WordPress upgrades by bumping this tag, independent of
#   our code. The SQLite db.php drop-in on the PVC makes it DB-server-free.
#
# The prep image (private, ghcr) pulls via the cluster-wide `ghcr-pull` Secret;
# the vanilla wordpress image is public (Docker Hub).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weeeeeiserbikes-wordpress
  namespace: weeeeeiserbikes-wordpress
  labels:
    app: weeeeeiserbikes-wordpress
spec:
  replicas: 1
  # SQLite is a single-writer file DB on a ReadWriteOnce PVC — never >1 replica.
  # Recreate (not RollingUpdate) avoids two pods racing the same volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weeeeeiserbikes-wordpress
  template:
    metadata:
      labels:
        app: weeeeeiserbikes-wordpress
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: wp-data
          persistentVolumeClaim:
            claimName: weeeeeiserbikes-wordpress-data
        - name: wp-config
          configMap:
            name: wordpress-config
      initContainers:
        # Preps the PVC: lays our code onto it + installs WP into SQLite. Owns
        # THEME/CODE; never rewrites CONTENT (the SQLite DB + uploads).
        - name: prep
          image: __IMAGE__
          env:
            - name: WORDPRESS_SITE_URL
              value: https://weeeeeiserbikes-wordpress.staging.tripoli.systems
          envFrom:
            # WORDPRESS_ADMIN_PASSWORD from Vault (kv/wordpress-admin). optional:
            # true so prep still runs (generating a random admin password) before
            # the secret is seeded.
            - secretRef:
                name: wordpress-admin
                optional: true
          volumeMounts:
            - { name: wp-data, mountPath: /var/www/html/wp-content }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
      containers:
        # The unmodified upstream WordPress image. Its own entrypoint populates
        # the docroot + (seeing the mounted wp-config.php) skips config
        # generation, then serves. No DB server — db.php on the PVC = SQLite.
        - name: wordpress
          image: wordpress:6.7-php8.3-apache
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_SITE_URL
              value: https://weeeeeiserbikes-wordpress.staging.tripoli.systems
          volumeMounts:
            - { name: wp-data,   mountPath: /var/www/html/wp-content }
            - { name: wp-config, mountPath: /var/www/html/wp-config.php, subPath: wp-config.php, readOnly: true }
          # /wp-login.php is lightweight (no theme/DB-heavy render) and confirms
          # PHP + WP are up. A 200 here means the prepped volume is serving.
          startupProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: "1", memory: 512Mi }
