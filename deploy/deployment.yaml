---
# image is digest-pinned by CI: __IMAGE__ is rewritten to
# ghcr.io/licenseplated/sagebrushcycles@sha256:<digest> before the bundle is
# pushed, so each new build changes the manifest and rolls the pod.
#
# ghcr.io/licenseplated/sagebrushcycles is private; the cluster-wide
# `ghcr-pull` Secret (rumi infrastructure/external-secrets-store/ghcr-pull.yaml,
# fanned to every namespace from Vault kv/ghcr/pull) authenticates the pull.
#
# NOTE: Grav stores content as flat files inside the container. Admin edits do
# NOT survive a pod restart unless user/ is on a PVC. See CMS-NOTES.md for the
# ephemeral-storage caveat and the optional PVC + volumeMounts to add here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weeeeeiserbikes-grav
  namespace: weeeeeiserbikes-grav
  labels:
    app: weeeeeiserbikes-grav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weeeeeiserbikes-grav
  template:
    metadata:
      labels:
        app: weeeeeiserbikes-grav
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: grav-data
          persistentVolumeClaim:
            claimName: weeeeeiserbikes-grav-data
      # Seed the (initially empty) PVC from the image's pristine user/ dirs on
      # first boot, so pages/config exist and accounts/data have a home. Only
      # the mutable dirs are persisted — themes/plugins stay from the image.
      initContainers:
        - name: seed-data
          image: __IMAGE__
          command:
            - sh
            - -c
            - |
              for d in pages config data accounts; do
                if [ ! -e "/data/$d" ]; then
                  if [ -e "/var/www/html/user/$d" ]; then cp -a "/var/www/html/user/$d" "/data/$d";
                  else mkdir -p "/data/$d"; fi
                fi
              done
              chown -R www-data:www-data /data
          volumeMounts:
            - name: grav-data
              mountPath: /data
      containers:
        - name: grav
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 80
          # PVC-backed mutable dirs (admin edits persist). The theme — incl. the
          # React app.js bundle — is deliberately NOT mounted, so it updates with
          # each image build.
          volumeMounts:
            - { name: grav-data, mountPath: /var/www/html/user/pages,    subPath: pages }
            - { name: grav-data, mountPath: /var/www/html/user/accounts, subPath: accounts }
            - { name: grav-data, mountPath: /var/www/html/user/config,   subPath: config }
            - { name: grav-data, mountPath: /var/www/html/user/data,     subPath: data }
          envFrom:
            # GRAV_ADMIN_PASSWORD from Vault (kv/grav-admin). optional:true so the
            # pod (and the site) start before the secret is seeded.
            - secretRef:
                name: grav-admin
                optional: true
          # startupProbe gives the first boot generous time (Grav cache warmup +
          # account creation) before liveness takes over — up to 30×2s = 60s.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
