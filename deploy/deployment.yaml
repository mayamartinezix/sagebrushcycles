---
# image is digest-pinned by CI: __IMAGE__ is rewritten to
# ghcr.io/licenseplated/sagebrushcycles@sha256:<digest> before the bundle is
# pushed, so each new build changes the manifest and rolls the pod.
#
# ghcr.io/licenseplated/sagebrushcycles is private; the cluster-wide
# `ghcr-pull` Secret (rumi infrastructure/external-secrets-store/ghcr-pull.yaml,
# fanned to every namespace from Vault kv/ghcr/pull) authenticates the pull.
#
# Variant: cms/decap — static nginx site + a vendored Decap CMS editor at
# /admin. Same nginx image shape as the original; only the served files differ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weeeeeiserbikes-decap
  namespace: weeeeeiserbikes-decap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weeeeeiserbikes-decap
  template:
    metadata:
      labels:
        app: weeeeeiserbikes-decap
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: nginx
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
        # OAuth provider sidecar for the Decap editor (built from oauth/Dockerfile;
        # __OAUTH_IMAGE__ is digest-pinned by CI alongside __IMAGE__). The site's
        # HTTPRoute path-routes /auth + /callback to this container on :3000.
        - name: oauth
          image: __OAUTH_IMAGE__
          ports:
            - name: oauth
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Bare hostname(s) login may succeed on (no scheme) — vencax matches
            # the postMessage origin against this.
            - name: ORIGINS
              value: "weeeeeiserbikes-decap.staging.tripoli.systems"
            # The public callback; must equal the GitHub OAuth App's callback URL.
            - name: REDIRECT_URL
              value: "https://weeeeeiserbikes-decap.staging.tripoli.systems/callback"
          envFrom:
            # OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET from Vault (kv/decap-oauth).
            # optional:true so the pod (and the site) still start before the
            # secret is seeded — only the login flow is unavailable until then.
            - secretRef:
                name: decap-oauth
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: oauth
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
