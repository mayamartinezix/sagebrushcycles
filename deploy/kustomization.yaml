---
# Manifest bundle for weeeeeiserbikes.staging.tripoli.systems.
#
# This directory is NOT applied from git. CI (.github/workflows/build-deploy.yml)
# substitutes the freshly-built image digest into deployment.yaml, then
# `flux push artifact`s this tree to oci://ghcr.io/licenseplated/sagebrushcycles-deploy
# (tags: <sha> + moving `preview`). rumi's OCIRepository/Kustomization
# `weeeeeiserbikes` (apps/weeeeeiserbikes/ in the rumi repo) pulls `preview`
# and applies it; a Flux Receiver fronted by flux-webhook.staging.tripoli.systems
# triggers an immediate pull on each push (the OCIRepository interval is the
# fallback).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
