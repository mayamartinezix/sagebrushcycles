---
# Manifest bundle for weeeeeiserbikes-grav.staging.tripoli.systems (Grav variant).
#
# This directory is NOT applied from git. CI (.github/workflows/build-deploy.yml)
# substitutes the freshly-built image digest into deployment.yaml, then
# `flux push artifact`s this tree to oci://ghcr.io/licenseplated/sagebrushcycles-deploy
# (tags: grav-<sha> + moving `grav-preview`). rumi's OCIRepository/Kustomization
# `weeeeeiserbikes-grav` (apps/weeeeeiserbikes-grav/ in the rumi repo) pulls
# `grav-preview` and applies it; a Flux Receiver fronted by
# flux-webhook.staging.tripoli.systems triggers an immediate pull on each push
# (the OCIRepository interval is the fallback).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - pvc.yaml
  - externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
