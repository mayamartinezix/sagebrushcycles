---
# GitHub OAuth App credentials for the Decap login sidecar, sourced from Vault.
# Seed once (you create the OAuth App; never commit these):
#   vault kv put kv/decap-oauth client_id=<Client ID> client_secret=<Client Secret>
#
# The rendered Secret's KEYS are the env var names the vencax provider reads, so
# the Deployment can `envFrom` it directly. Uses the same cluster `vault`
# ClusterSecretStore as the webhook tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: decap-oauth
  namespace: weeeeeiserbikes-decap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: decap-oauth
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: decap-oauth
        property: client_id
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: decap-oauth
        property: client_secret
