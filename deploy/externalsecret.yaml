---
# WordPress admin password, sourced from Vault. Seed once (never commit it):
#   vault kv put kv/wordpress-admin password=<a strong password>
#
# The rendered Secret's key WORDPRESS_ADMIN_PASSWORD is the env var the
# entrypoint reads to create the admin account during `wp core install` on first
# boot. Uses the cluster `vault` ClusterSecretStore (the vault-cluster-pull
# policy must allow kv/data/wordpress-admin).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wordpress-admin
  namespace: weeeeeiserbikes-wordpress
spec:
  # Short interval so a Vault password rotation (or a first-time policy/sync
  # fix) propagates to the Secret within a minute; the prep re-asserts it.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: wordpress-admin
    creationPolicy: Owner
  data:
    - secretKey: WORDPRESS_ADMIN_PASSWORD
      remoteRef:
        key: wordpress-admin
        property: password
