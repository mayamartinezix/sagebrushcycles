---
# Grav admin password, sourced from Vault. Seed once (never commit it):
#   vault kv put kv/grav-admin password=<a strong password>
#
# The rendered Secret's key GRAV_ADMIN_PASSWORD is the env var the entrypoint
# reads to create the admin account on first boot. Uses the cluster `vault`
# ClusterSecretStore (the vault-cluster-pull policy must allow kv/data/grav-admin).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grav-admin
  namespace: weeeeeiserbikes-grav
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: grav-admin
    creationPolicy: Owner
  data:
    - secretKey: GRAV_ADMIN_PASSWORD
      remoteRef:
        key: grav-admin
        property: password
